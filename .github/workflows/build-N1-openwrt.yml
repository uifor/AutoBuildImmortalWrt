name: Build OpenWrt Firmware for Phicomm N1 (Bypass Router)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 分支或标签（默认 openwrt-24.10）'
        required: true
        default: openwrt-24.10
      kernel_version:
        description: '自定义内核版本（如 6.12.65），留空使用最新稳定内核（自动更新 6.1/6.6 系列）'
        required: false
        default: '6.12.65'

jobs:
  build-n1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-distutils python3-setuptools rsync subversion \
          swig time unzip wget zlib1g-dev upx-ucl zip quilt libglib2.0-dev dosfstools

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git -b ${{ inputs.openwrt_version }} --depth=1 openwrt
          cd openwrt
          ./scripts/feeds update -a

      - name: Add custom feeds
        run: |
          cd openwrt
          cat << EOF >> feeds.conf.default
          src-git dockerman https://github.com/lisaac/luci-app-dockerman.git
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git
          src-git lucky https://github.com/gdy666/lucky.git
          src-git openlist https://github.com/OpenListTeam/OpenList-OpenWrt.git
          src-git amlogic https://github.com/ophub/luci-app-amlogic.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Minimal .config (LuCI + required packages + new packages)
        run: |
          cd openwrt
          cat << EOF > .config
          CONFIG_TARGET_armvirt=y
          CONFIG_TARGET_armvirt_64=y
          CONFIG_TARGET_armvirt_64_Default=y

          CONFIG_LUCI_SRCDIET=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-ssl-openssl=y

          # 新增软件包
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y  # 软件包管理器中文（标准名称为 opkg）

          # 必装应用
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_containerd=y
          CONFIG_PACKAGE_libnetwork=y
          CONFIG_PACKAGE_cgroupfs-mount=y

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y

          CONFIG_PACKAGE_luci-app-nikki=y

          CONFIG_PACKAGE_luci-app-openlist=y

          # 晶晨宝盒
          CONFIG_PACKAGE_luci-app-amlogic=y

          # 基础可用性
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_openssl-util=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_resize2fs=y
          EOF
          make defconfig

      - name: Download sources & compile
        run: |
          cd openwrt
          make download -j8 || make download -j1
          make -j$(nproc) || make -j1 V=s

      - name: Locate original rootfs
        id: find_rootfs
        run: |
          ROOTFS=$(ls openwrt/bin/targets/armvirt/64/*rootfs.tar.gz | head -1)
          if [ -z "$ROOTFS" ]; then echo "Rootfs not found!"; exit 1; fi
          echo "Found rootfs: $ROOTFS"
          echo "file=$ROOTFS" >> $GITHUB_OUTPUT

      - name: Modify rootfs for bypass router (DHCP client on eth0, disable DHCP server)
        run: |
          mkdir unpacked
          tar -xzf "${{ steps.find_rootfs.outputs.file }}" -C unpacked
          cat << 'EOF' > unpacked/etc/config/network
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'auto'

          config interface 'lan'
              option device 'eth0'
              option proto 'dhcp'

          config dhcp 'lan'
              option interface 'lan'
              option ignore '1'
          EOF
          tar -czf modified_rootfs.tar.gz -C unpacked .
          echo "MODIFIED_ROOTFS=$GITHUB_WORKSPACE/modified_rootfs.tar.gz" >> $GITHUB_ENV

      - name: Package N1 firmware using flippy-openwrt-actions
        uses: wukongdaily/flippy-openwrt-actions@master
        env:
          OPENWRT_ARMSR: ${{ env.MODIFIED_ROOTFS }}
          PACKAGE_SOC: s905d
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version || '6.1.y_6.6.y' }}
          KERNEL_AUTO_LATEST: ${{ inputs.kernel_version != '' && 'false' || 'true' }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phicomm-N1-Bypass-OpenWrt-${{ inputs.openwrt_version }}${{ inputs.kernel_version != '' && format('-k{0}', inputs.kernel_version) || '-latest-stable' }}
          path: /opt/openwrt_packit/output/*.img*
